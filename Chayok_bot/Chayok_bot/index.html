<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chayok Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1c1c1e; color: white; margin: 0; padding: 20px; }
        .cup { font-size: 100px; cursor: pointer; user-select: none; transition: transform 0.1s; }
        .cup:active { transform: scale(0.9); }
        .stat-box { margin: 15px 0; font-size: 20px; }
        .energy-bar-container { width: 80%; background: #333; height: 20px; border-radius: 10px; margin: 0 auto; overflow: hidden; }
        .energy-bar { width: 100%; height: 100%; background: #007aff; transition: width 0.2s; }
        .top-container { margin-top: 30px; background: #2c2c2e; padding: 15px; border-radius: 12px; }
        .top-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #3a3a3c; }
    </style>
</head>
<body>

    <h2>☕ Чайок Кликер</h2>
    <div class="stat-box">Клики: <span id="clicks">0</span></div>

    <div class="cup" onclick="makeClick()">☕</div>

    <div class="stat-box">⚡ Энергия: <span id="energy-text">100/100</span></div>
    <div class="energy-bar-container">
        <div id="energy-bar" class="energy-bar"></div>
    </div>

    <div class="top-container">
        <h3>🏆 Топ-10 Игроков</h3>
        <div id="top-list">Загрузка...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 12345;
        const API_URL = "https://chayok-bot.onrender.com";

        async function loadUserData() {
            const res = await fetch(`${API_URL}/get_user`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ user_id: userId })
            });
            const data = await res.json();
            updateUI(data.clicks, data.energy, data.max_energy);
        }

        async function makeClick() {
            const res = await fetch(`${API_URL}/click`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ user_id: userId })
            });
            const data = await res.json();
            updateUI(data.clicks, data.energy, data.max_energy);
            loadTop();
        }

        function updateUI(clicks, energy, maxEnergy) {
            document.getElementById("clicks").innerText = clicks;
            document.getElementById("energy-text").innerText = `${energy}/${maxEnergy}`;
            const percent = (energy / maxEnergy) * 100;
            document.getElementById("energy-bar").style.width = `${percent}%`;
        }

        async function loadTop() {
            const res = await fetch(`${API_URL}/top`);
            const topData = await res.json();
            const list = document.getElementById("top-list");
            list.innerHTML = "";
            topData.forEach((player, index) => {
                list.innerHTML += `
                    <div class="top-item">
                        <span>#${index + 1} ID: ${player.user_id}</span>
                        <span><b>${player.clicks}</b> ☕</span>
                    </div>`;
            });
        }

        loadUserData();
        loadTop();
    </script>
</body>
</html>
