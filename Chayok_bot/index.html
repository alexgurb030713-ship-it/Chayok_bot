<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chayok Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1c1c1e; color: white; margin: 0; padding: 20px; }
        .cup { font-size: 100px; cursor: pointer; user-select: none; transition: transform 0.1s; margin: 20px 0; }
        .cup:active { transform: scale(0.9); }
        .stat-box { margin: 10px 0; font-size: 18px; background: #2c2c2e; padding: 10px; border-radius: 10px; }
        .energy-bar-container { width: 100%; background: #333; height: 16px; border-radius: 8px; overflow: hidden; margin-top: 5px; }
        .energy-bar { width: 100%; height: 100%; background: #007aff; transition: width 0.2s; }
        .top-container { margin-top: 20px; background: #2c2c2e; padding: 15px; border-radius: 12px; text-align: left; }
        .top-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #3a3a3c; font-size: 14px; }
    </style>
</head>
<body>

    <h2>☕ Чайок Кликер</h2>
    
    <div class="stat-box">
        <div>🖱 Клики: <span id="clicks">0</span></div>
        <div>🪙 Монеты: <span id="coins">0</span></div>
    </div>

    <div class="cup" onclick="makeClick()">☕</div>

    <div class="stat-box">
        <div>⚡ Энергия: <span id="energy-text">100/100</span></div>
        <div class="energy-bar-container">
            <div id="energy-bar" class="energy-bar"></div>
        </div>
    </div>

    <div class="top-container">
        <h3 style="text-align: center; margin-top: 0;">🏆 Топ-10 Игроков</h3>
        <div id="top-list">Загрузка...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 12345;

        // Вставьте сюда вашу реальную ссылку с Render (без слеша в конце)
        const API_URL = "https://chayok-bot.onrender.com";

        async function loadUserData() {
            try {
                const res = await fetch(`${API_URL}/get_user`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                updateUI(data);
            } catch (e) {
                console.error("Ошибка загрузки пользователя", e);
            }
        }

        async function makeClick() {
            try {
                const res = await fetch(`${API_URL}/click`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                updateUI(data);
                loadTop();
            } catch (e) {
                console.error("Ошибка клика", e);
            }
        }

        function updateUI(data) {
            document.getElementById("clicks").innerText = data.clicks;
            document.getElementById("coins").innerText = data.coins;
            document.getElementById("energy-text").innerText = `${data.energy}/${data.max_energy}`;
            const percent = (data.energy / data.max_energy) * 100;
            document.getElementById("energy-bar").style.width = `${percent}%`;
        }

        async function loadTop() {
            try {
                const res = await fetch(`${API_URL}/top`);
                const topData = await res.json();
                const list = document.getElementById("top-list");
                list.innerHTML = "";
                topData.forEach((player, index) => {
                    list.innerHTML += `
                        <div class="top-item">
                            <span>#${index + 1} ID: ${player.user_id}</span>
                            <span><b>${player.clicks}</b> кликов | <b>${player.coins}</b> 🪙</span>
                        </div>`;
                });
            } catch (e) {
                console.error("Ошибка загрузки топа", e);
            }
        }

        loadUserData();
        loadTop();
    </script>
</body>
</html>
