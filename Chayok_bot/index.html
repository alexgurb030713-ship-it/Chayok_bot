<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chayok Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
        .card { background: #16213e; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .coin { width: 140px; height: 140px; background: #f39c12; border-radius: 50%; display: inline-block; line-height: 140px; font-size: 60px; cursor: pointer; user-select: none; margin: 20px 0; border: 4px solid #f1c40f; transition: transform 0.1s; }
        .coin:active { transform: scale(0.92); }
        .btn { background: #e74c3c; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn:active { opacity: 0.8; }
        .price-btn { background: #27ae60; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Уровень: <span id="level">1</span></h2>
        <h3>Монеты: <span id="clicks">0</span> 🪙</h3>
        <p>Спинов рулетки: <b id="spins">0</b> 🎰</p>
    </div>

    <div class="coin" onclick="makeClick()">🐹</div>

    <div class="card">
        <h3>🎰 Бонусная Рулетка</h3>
        <button class="btn" onclick="spinRoulette()">Крутить рулетку</button>
        <p id="prize-result" style="color: #f1c40f; font-weight: bold;"></p>
        <p><small>Инвентарь: <span id="inventory">пусто</span></small></p>
    </div>

    <div class="card">
        <h3>⭐ Услуги и Заказы</h3>
        <p><small>Прокачка, Брейнроты, Реклама</small></p>
        <button class="btn price-btn" onclick="openOrder()">Заказать @Chayok_UKRAINE</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Получаем ID пользователя из Telegram или берем тестовый
        const userId = tg.initDataUnsafe?.user?.id || 12345;
        const SERVER_URL = window.location.origin; // Ссылка на наш сервер

        // Загрузка профиля
        async function loadProfile() {
            try {
                let res = await fetch(`${SERVER_URL}/api/profile/${userId}`);
                let data = await res.json();
                document.getElementById('clicks').innerText = data.clicks;
                document.getElementById('level').innerText = data.level;
                document.getElementById('spins').innerText = data.spins;
                document.getElementById('inventory').innerText = data.inventory || 'пусто';
            } catch (e) { console.error(e); }
        }

        // Клик
        async function makeClick() {
            let res = await fetch(`${SERVER_URL}/api/click`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, clicks: 1 })
            });
            let data = await res.json();
            document.getElementById('clicks').innerText = data.clicks;
            document.getElementById('level').innerText = data.level;
                document.getElementById('spins').innerText = data.spins;
        }

        // Рулетка
        async function spinRoulette() {
            let res = await fetch(`${SERVER_URL}/api/spin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId })
            });
            let data = await res.json();
            if (data.error) {
                document.getElementById('prize-result').innerText = data.error;
            } else {
                document.getElementById('prize-result').innerText = `Выиграно: ${data.prize}!`;
                document.getElementById('spins').innerText = data.spins_left;
                document.getElementById('inventory').innerText = data.inventory;
            }
        }

        function openOrder() {
            tg.openTelegramLink("https://t.me/Chayok_UKRAINE");
        }

        loadProfile();
    </script>
</body>
</html>
